# This workflow will build and test a full-stack application: 
# Spring Boot Java backend (Maven) and React Node.js frontend (npm).

name: Full Stack CI (Spring Boot & React)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'careergraph/**' # Trigger if any file in the 'src' folder changes
      - 'frontend/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'careergraph/**' # Trigger if any file in the 'src' folder changes
      - 'frontend/**'

jobs:
  backend-build:
    name: Build & Test Backend
    runs-on: ubuntu-latest

    # 1. Add the MySQL service container
    services:
      mysql:
        image: mysql:8.0 # Match your local MySQL version
        env:
          MYSQL_ROOT_PASSWORD: root # Set a temporary root password
          MYSQL_DATABASE: careergraph # Change this to match your DB name
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    defaults:
      run:
        working-directory: ./careergraph

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # 2. Add the Maven build step and inject the DB credentials
    - name: Build with Maven
      env:
        # These environment variables will override your application.properties during the pipeline
        SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/careergraph?useSSL=false
        SPRING_DATASOURCE_USERNAME: root
        SPRING_DATASOURCE_PASSWORD: root
      run: mvn clean install

    #- name: Update dependency graph
    #  uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6

  # ==========================================
  # JOB 2: FRONTEND (REACT / NODE.JS)
  # ==========================================
  frontend-build:
    name: Build & Test Frontend
    runs-on: ubuntu-latest

    # Tells GitHub Actions to run all npm commands inside your frontend folder
    defaults:
      run:
        working-directory: ./frontend # Change this if your folder is named differently

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Adjust to match your project's Node version
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json' # Adjust path as needed

    # npm ci is preferred in CI environments over npm install for clean, reliable installs
    - name: Install Dependencies
      run: npm ci

    - name: Run Tests
      run: npm test
      env:
        CI: true # Forces tests (like Jest) to run non-interactively and exit

    - name: Build React App
      run: npm run build
